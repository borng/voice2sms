plugins {
    id 'com.android.application'
}

def computeGitSha() {
    try {
        def out = new ByteArrayOutputStream()
        def err = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = out
            errorOutput = err
            ignoreExitValue = true
        }
        if (result.exitValue != 0) return 'unknown'
        def sha = out.toString().trim()
        return sha.isEmpty() ? 'unknown' : sha
    } catch (Exception e) {
        return 'unknown'
    }
}

def computeBuildDate() {
    return new Date().format('yyyy-MM-dd')
}

android {
    namespace 'com.voice2sms'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.voice2sms"
        minSdk 24
        targetSdk 34
        // versionCode and versionName are set dynamically from git tags in CI,
        // or fall back to defaults for local builds
        versionCode project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE').toInteger() : 1
        versionName project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : "1.2.0"
        // Build stamp surfaced in SettingsActivity for bug-report triage.
        buildConfigField 'String', 'GIT_SHA', "\"${computeGitSha()}\""
        buildConfigField 'String', 'BUILD_DATE', "\"${computeBuildDate()}\""
    }

    signingConfigs {
        release {
            // CI: keystore from environment variables (GitHub Secrets)
            // Local: reads from keystore.properties (gitignored)
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) props.load(new FileInputStream(propsFile))

            storeFile file(System.getenv('KEYSTORE_PATH') ?: "${rootProject.projectDir}/keystore/release.jks")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: props.getProperty('storePassword', '')
            keyAlias System.getenv('KEY_ALIAS') ?: props.getProperty('keyAlias', 'voice2sms')
            keyPassword System.getenv('KEY_PASSWORD') ?: props.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.15.0'
    // Wearable Data Layer for receiving SMS send requests from the Voice2SMS watch companion.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    testImplementation 'junit:junit:4.13.2'
    // org.json for unit-testing WearPayloadValidator off-device. Android ships the same
    // classes at runtime; using org.json in tests keeps validation logic JVM-testable.
    testImplementation 'org.json:json:20251224'
}
