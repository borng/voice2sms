plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voice2sms'
    compileSdk 35

    defaultConfig {
        applicationId "com.voice2sms"
        minSdk 24
        targetSdk 34
        // versionCode and versionName are set dynamically from git tags in CI,
        // or fall back to defaults for local builds
        versionCode project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE').toInteger() : 1
        versionName project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : "1.1.0"
    }

    signingConfigs {
        release {
            // CI: keystore from environment variables (GitHub Secrets)
            // Local: hardcoded defaults for dev builds
            storeFile file(System.getenv('KEYSTORE_PATH') ?: "${rootProject.projectDir}/keystore/release.jks")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: "voice2sms"
            keyAlias System.getenv('KEY_ALIAS') ?: "voice2sms"
            keyPassword System.getenv('KEY_PASSWORD') ?: "voice2sms"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.15.0'
}
